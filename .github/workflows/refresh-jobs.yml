name: Refresh jobs

on:
  schedule:
    - cron: "27 1 * * *"    # 06:57 IST
    - cron: "27 13 * * *"   # 18:57 IST
  workflow_dispatch: {}      # "Run workflow" button for a manual refresh

permissions:
  contents: write

concurrency:
  group: refresh-jobs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch jobs
        id: fetch
        run: python scripts/fetch_jobs.py

      - name: Commit changes
        run: |
          git config user.name "job-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Refresh jobs: ${{ steps.fetch.outputs.total }} roles (${{ steps.fetch.outputs.new }} new)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "Push failed, retrying ($i)..."
            sleep 10
          done
          exit 1
